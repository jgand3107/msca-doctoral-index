name: Weekly MSCA doctoral scrape

on:
  schedule:
    # Every Monday at 06:00 UTC. Adjust as you like (minute hour * * day-of-week).
    - cron: "0 6 * * 1"
  workflow_dispatch: {}   # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write          # needed to commit refreshed data back to the repo

concurrency:
  group: msca-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python run.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true   # honour .gitattributes merge=ours
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Weekly MSCA doctoral update ($(date -u +%Y-%m-%d))"
          # Push, retrying if the remote moved (e.g. a concurrent push): merge
          # in remote commits, keeping our freshly-generated data on conflict.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected; integrating remote changes (attempt $attempt)..."
            git fetch origin main
            git merge --no-edit origin/main || true
          done
          echo "Could not push after 3 attempts." >&2
          exit 1
