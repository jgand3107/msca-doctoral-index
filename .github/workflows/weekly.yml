name: Weekly scholarship scrape

on:
  schedule:
    # Every Monday at 06:00 UTC. Adjust as you like (minute hour * * day-of-week).
    - cron: "0 6 * * 1"
  workflow_dispatch: {}   # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write          # needed to commit refreshed data back to the repo

concurrency:
  group: msca-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper and commit valid data
        run: |
          set +e
          python run.py
          run_code=$?
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true   # honour .gitattributes merge=ours
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Weekly scholarship update ($(date -u +%Y-%m-%d))"
            pushed=0
            for attempt in 1 2 3; do
              if git push; then echo "Pushed on attempt $attempt."; pushed=1; break; fi
              echo "Push rejected; integrating remote changes (attempt $attempt)..."
              git fetch origin main
              git merge --no-edit origin/main || true
            done
            [ "$pushed" = 1 ] || { echo "Could not push." >&2; exit 1; }
          fi
          # Propagate a primary-tier failure (valid data was still committed).
          if [ "$run_code" -ne 0 ]; then
            echo "Scraper reported a primary-tier failure (exit $run_code)." >&2
            exit "$run_code"
          fi
